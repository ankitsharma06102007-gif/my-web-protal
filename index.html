<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankit Sharma - Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 380px;
            width: 100%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #00f2fe;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            box-shadow: 0 0 20px #00f2fe;
        }
        h1 { margin: 10px 0; font-size: 26px; letter-spacing: 1px; }
        .tag { color: #00f2fe; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; display: inline-block; }
        p { color: #cfd8dc; font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
        .social-links a {
            display: block;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: 500;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .social-links a:hover {
            background: #00f2fe;
            color: #0f2027;
            box-shadow: 0 0 15px #00f2fe;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar">👨‍💻</div>
        <h1>अंकित शर्मा</h1>
        <span class="tag">Web Developer</span>
        <p>नमस्ते! यह मेरा पर्सनल वेब पोर्टल है। मुझे नई टेक्नोलॉजीज सीखना और कोड के जरिए नए प्रोजेक्ट्स बनाना पसंद है।</p>
        
        <div class="social-links">
            <a href="https://github.com" target="_blank">My GitHub Profile</a>
            <a href="https://instagram.com" target="_blank">Follow Me on Instagram</a>
        </div>
    </div>

</body>
</html>
